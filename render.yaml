services:
  - type: web
    name: roadxsolution-mcsearch
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # NOTE: gunicorn settings live in gunicorn.conf.py (workers=1,
    # timeout=120). Do NOT add --workers 2 here: scan stop/resume/status
    # depend on the in-process RUNNING_SCANS dict (see gunicorn.conf.py).
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # The admin account is seeded from these at startup (never by
      # "first signup wins"). Set the password in the Render dashboard —
      # never commit it here.
      - key: ROAD_ADMIN_EMAIL
        value: zackalbert.dispatch@gmail.com
      - key: ROAD_ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
